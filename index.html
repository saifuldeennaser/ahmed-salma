<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4e1721">
    <title>Ahmed & Salma - Wedding Invitation</title>
    <!-- Preconnect to font providers -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Load Allura + Cairo (Arabic support) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Cairo:wght@400;600&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen" class="splash-screen">
        <div class="splash-content">
            <div class="splash-crest">A & S</div>
            <p class="splash-subtitle">Ahmed & Salma</p>
            <div class="splash-loader">
                <div class="splash-loader-progress"></div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="envelope-wrapper">
            <div class="invitation-text">
                <p class="subtitle" data-i18n="subtitle">A love letter from</p>
                <h1>Ahmed & Salma</h1>
            </div>
            <div class="center-action" id="open-invitation" aria-hidden="false">
                <div class="center-action-inner">
                    <p data-i18n="open-btn">Open the invitation</p>
                </div>
            </div>
        </div>
    </div>

        <!-- Desktop-only overlay prompting mobile view -->
        <div class="desktop-overlay" aria-hidden="true">
            <div class="desktop-overlay-inner">
                <p>Open the invitation on mobile for better view</p>
            </div>
        </div>

    <!-- Language Toggle -->
    <button class="lang-btn" id="lang-btn" aria-label="Toggle language" data-i18n="lang-switch" style="position:fixed;top:1rem;right:1rem;z-index:10000;padding:0.38rem 1rem;border-radius:999px;border:1.5px solid rgba(78,23,27,0.28);background:rgba(255,255,255,0.92);color:#4e1721;font-family:'Cairo','Georgia',sans-serif;font-size:0.82rem;font-weight:600;cursor:pointer;opacity:1;box-shadow:0 4px 16px rgba(78,23,27,0.13);">عربي</button>

    <!-- Background Music -->
    <audio id="bg-music" src="audio/mm.mp3" loop preload="auto"></audio>

    <script src="config.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
